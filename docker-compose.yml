services:
  traefik:
    profiles: ["app"]
    image: traefik:v3.7.1
    restart: unless-stopped
    init: true
    read_only: true

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./.secrets/traefik:/run/secrets/traefik:ro

    networks:
      - app

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:17.10-bookworm
    container_name: depot-numerique-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.9-bookworm
    container_name: depot-numerique-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: depot-numerique-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  openldap:
    image: osixia/openldap:1.5.0
    container_name: depot-numerique-openldap
    restart: unless-stopped
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Justice"
      LDAP_DOMAIN: "justice.fr"
      LDAP_BASE_DN: "dc=justice,dc=fr"
      LDAP_ADMIN_PASSWORD: ${OPENLDAP_ADMIN_PASSWORD:-admin}
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    ports:
      - "${OPENLDAP_PORT:-389}:389"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./sso/openldap/schema/depot-numerique.schema:/container/service/slapd/assets/config/bootstrap/schema/custom/depot-numerique.schema:ro
      - ./sso/openldap/ldif/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/bootstrap.ldif:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost:389 -D cn=admin,dc=justice,dc=fr -w \"$${LDAP_ADMIN_PASSWORD}\" -b dc=justice,dc=fr -s base dc=justice",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: depot-numerique-phpldapadmin
    restart: unless-stopped
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${PHPLDAPADMIN_PORT:-8081}:80"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2-1
    container_name: depot-numerique-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://${IDP_PUBLIC_HOST:-idp.depot-numerique.localhost}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./sso/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - default
      - app
    labels:
      traefik.enable: "true"
      traefik.http.routers.keycloak.rule: Host(`${IDP_PUBLIC_HOST:-idp.depot-numerique.localhost}`)
      traefik.http.routers.keycloak.entrypoints: websecure
      traefik.http.routers.keycloak.tls: "true"
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    working_dir: /workspace/packages/database
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-documents-raw}

      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOST:-depot-numerique.localhost}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}

      BETTER_AUTH_URL: https://${PUBLIC_HOST:-depot-numerique.localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be provided}
      BETTER_AUTH_WEB_ORIGIN: https://${PUBLIC_HOST:-depot-numerique.localhost}

      SSO_PROVIDER_ID: ${SSO_PROVIDER_ID:-justice-saml}
      SSO_DOMAIN: ${SSO_DOMAIN:-justice.fr}
      SSO_SP_ENTITY_ID: ${SSO_SP_ENTITY_ID:-depot-numerique}
      SSO_IDP_METADATA_URL: http://keycloak:8080/realms/depot-numerique/protocol/saml/descriptor
      SSO_SP_SIGNING_PRIVATE_KEY_PATH: /run/secrets/saml/sp-signing-private-key.pem
      SSO_SP_SIGNING_CERTIFICATE_PATH: /run/secrets/saml/sp-signing-certificate.pem
      SSO_SP_ENCRYPTION_PRIVATE_KEY_PATH: /run/secrets/saml/sp-encryption-private-key.pem
      SSO_SP_ENCRYPTION_CERTIFICATE_PATH: /run/secrets/saml/sp-encryption-certificate.pem

    volumes:
      - ./.secrets/saml:/run/secrets/saml:ro

    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`${PUBLIC_HOST:-depot-numerique.localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.priority: "100"
      traefik.http.routers.api.tls: "true"
      traefik.http.services.api.loadbalancer.server.port: "3000"

    networks:
      - default
      - app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: Host(`${PUBLIC_HOST:-depot-numerique.localhost}`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.middlewares: web-defaults@file
      traefik.http.routers.web.priority: "10"
      traefik.http.routers.web.tls: "true"
      traefik.http.services.web.loadbalancer.server.port: "8080"
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  minio_data:
  openldap_data:
  openldap_config:

networks:
  app:
    name: depot-numerique-app

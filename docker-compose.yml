services:
  postgres:
    image: postgres:18.4-bookworm
    container_name: depot-numerique-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.9-bookworm
    container_name: depot-numerique-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: depot-numerique-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  openldap:
    image: osixia/openldap:1.5.0
    container_name: depot-numerique-openldap
    restart: unless-stopped
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Justice"
      LDAP_DOMAIN: "justice.fr"
      LDAP_BASE_DN: "dc=justice,dc=fr"
      LDAP_ADMIN_PASSWORD: ${OPENLDAP_ADMIN_PASSWORD:-admin}
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    ports:
      - "${OPENLDAP_PORT:-389}:389"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./sso/openldap/schema/depot-numerique.schema:/container/service/slapd/assets/config/bootstrap/schema/custom/depot-numerique.schema:ro
      - ./sso/openldap/ldif/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/bootstrap.ldif:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost:389 -D cn=admin,dc=justice,dc=fr -w \"$${LDAP_ADMIN_PASSWORD}\" -b dc=justice,dc=fr -s base dc=justice",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: depot-numerique-phpldapadmin
    restart: unless-stopped
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${PHPLDAPADMIN_PORT:-8081}:80"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: depot-numerique-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./sso/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  openldap_data:
  openldap_config:

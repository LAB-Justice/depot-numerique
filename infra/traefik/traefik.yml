# yaml-language-server: $schema=https://www.schemastore.org/traefik-v3.json

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    asDefault: true
    http:
      tls: {}

  traefik:
    address: ":8082"

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: depot-numerique-app

  file:
    directory: /etc/traefik/dynamic
    watch: true

ping:
  entryPoint: traefik

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
